version: '3'
services:
  gnpslcms-dash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gnpslcms-dash
    ports:
    - "6548:5000"
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    read_only: true
    environment:
      VIRTUAL_HOST: ${HOSTNAME:-dashboard.gnps2.org}
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: ${HOSTNAME:-dashboard.gnps2.org}
      LETSENCRYPT_EMAIL: mwang87@gmail.com
      FORWARD_BASE: ${FORWARD_BASE:-https://dashboard2.gnps2.org}
      # Unset by default so existing API consumers are not throttled at cutover.
      DOWNLOADLINK_RATELIMIT: ${DOWNLOADLINK_RATELIMIT:-}
      # Comma-separated CIDRs that bypass the limit entirely (lab + infra).
      RATELIMIT_EXEMPT_CIDRS: ${RATELIMIT_EXEMPT_CIDRS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  nginx-net:
    external: true
