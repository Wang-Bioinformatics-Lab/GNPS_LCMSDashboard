services:
  gnpslcms-dash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gnpslcms-dash
    # Cloudflare terminates TLS and proxies to this origin. There is no
    # nginx-proxy / letsencrypt companion any more, and no shared proxy network
    # to join, so the port is published directly.
    #
    # This origin speaks plain HTTP. If it is reachable from the open internet,
    # restrict it to Cloudflare's published IP ranges at the host firewall -
    # otherwise it can be hit directly, bypassing Cloudflare entirely. Set
    # BIND_ADDRESS=127.0.0.1 instead if fronting it with a cloudflared tunnel.
    ports:
    - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-6548}:5000"
    restart: unless-stopped
    read_only: true
    # The root filesystem is read-only, so give the container a writable /tmp.
    # gunicorn puts each worker's heartbeat file there; without it the arbiter
    # dies with "No usable temporary directory found". It is a bind mount of
    # ./temp rather than a tmpfs so the contents are inspectable from the host.
    # The image runs as uid 1000, so ./temp must be writable by uid 1000.
    volumes:
    - ./temp:/tmp
    environment:
      FORWARD_BASE: ${FORWARD_BASE:-https://dashboard2.gnps2.org}
      # gunicorn's control server writes under $HOME/.gunicorn, and the user's
      # home lives on the read-only root filesystem. Point HOME at ./temp too.
      HOME: /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
