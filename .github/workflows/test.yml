name: Unit Testing

on:
  - push
  - pull_request

jobs:
  unit-test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest
    - name: Routing and validation tests
      run: cd test && make app
    - name: USI resolution tests (hits upstream repositories)
      # Upstream repositories go down independently of this repo; do not fail
      # the build on their outages.
      continue-on-error: true
      run: cd test && make resolve
